name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis & linting
  # ---------------------------------------------------------------------------
  lint:
    name: PHP Lint & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, intl
          coverage: none

      - name: Install PHP_CodeSniffer + Moodle coding standard
        # moodlehq/moodle-cs requires phpcs ^3.13 — install both in one command
        # so composer resolves the constraint correctly (phpcs 4.x is incompatible).
        # allow-plugins must be set before require to unblock the PHPCS path installer.
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require \
            "squizlabs/php_codesniffer:^3.13" \
            "moodlehq/moodle-cs:*"
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Run PHP syntax check
        run: find plugin -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPCS (Moodle coding standard)
        run: |
          phpcs --standard=moodle \
                --extensions=php \
                --ignore=plugin/vendor,plugin/node_modules \
                plugin

  # ---------------------------------------------------------------------------
  # PHPUnit tests
  # ---------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (Moodle ${{ matrix.moodle-branch }}, PHP ${{ matrix.php }}, DB ${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: unused
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: moodle
          MARIADB_PASSWORD: moodle
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5 – PHP 8.3
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'
            database: pgsql

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, zip, gd, intl, pgsql, mysqli
          coverage: pcov
          ini-values: max_input_vars=5000

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> $GITHUB_PATH

      - name: Install Moodle
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-name moodle \
            --db-user moodle \
            --db-pass moodle \
            --branch ${{ matrix.moodle-branch }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_START_BEHAT_SERVERS: NO

      - name: Run PHPUnit tests
        run: moodle-plugin-ci phpunit
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # Behat acceptance tests
  # ---------------------------------------------------------------------------
  behat:
    name: Behat (Moodle ${{ matrix.moodle-branch }})
    runs-on: ubuntu-latest
    needs: phpunit
    if: false

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: moodle
          MARIADB_PASSWORD: moodle
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, zip, gd, intl, mysqli
          coverage: none
          ini-values: max_input_vars=5000

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> $GITHUB_PATH

      - name: Install Moodle
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-name moodle \
            --db-user root \
            --db-pass root \
            --branch ${{ matrix.moodle-branch }}
        env:
          DB: mariadb
          MOODLE_START_BEHAT_SERVERS: YES

      - name: Run Behat tests
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags @local_anonimapper

  # ---------------------------------------------------------------------------
  # Security audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies (dev)
        run: |
          if [ -f composer.json ]; then composer install --no-progress; fi

      - name: Run Psalm static analysis
        run: |
          if command -v psalm &> /dev/null; then
            psalm --no-cache
          else
            echo "Psalm not configured – skipping."
          fi

      - name: Check for known vulnerable dependencies
        run: |
          if [ -f composer.lock ]; then
            composer audit --no-interaction
          else
            echo "No composer.lock found – skipping dependency audit."
          fi
